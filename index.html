<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpeed Pro - 全球網絡審計集群</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: #151d30; 
            --text-main: #f3f4f6; 
            --accent: #22c55e; 
            --primary: #3b82f6;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        .header-area { text-align: center; margin-bottom: 30px; }
        .header-area h1 { margin: 0 0 10px 0; font-size: 2.2rem; }
        .header-area p { color: #9ca3af; margin: 0; font-size: 0.95rem; }

        /* 頂部雙卡片並排佈局 */
        .top-dashboards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .top-dashboards { grid-template-columns: 1fr; }
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border: 1px solid #24324f; 
        }

        /* 🎯 Fast 核心測速數字與按鈕區域 */
        .fast-dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .speed-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* 數字、單位與按鈕之間的間距 */
            margin: 20px 0;
            position: relative;
        }
        .speed-display { 
            font-size: 5rem; 
            font-weight: 800; 
            color: var(--text-main); 
            line-height: 1;
        }
        .unit-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .unit { font-size: 1.4rem; color: #9ca3af; font-weight: 500; }

        /* 🔄 右側主數字旁邊的仿 Fast 重新測速按鈕 */
        .fast-reload-btn {
            background: transparent;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
            margin-left: 5px;
        }
        .fast-reload-btn:hover {
            background: #3b82f6;
            color: white;
            transform: rotate(180deg);
        }
        .fast-reload-btn.spinning {
            animation: fast-spin 1s infinite linear;
            border-color: #4b5563;
            color: #4b5563;
            pointer-events: none;
        }

        .progress-container { width: 80%; background: #24324f; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s ease; }
        
        /* 下方 50 大站分類矩陣面板 */
        .category-card { background: var(--card-bg); border: 1px solid #24324f; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .category-title { font-size: 1.2rem; color: #f43f5e; font-weight: bold; margin: 0 0 15px 0; padding-bottom: 10px; border-bottom: 1px solid #24324f; }
        
        /* 表格結構優化 */
        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #1f293d; font-size: 0.9rem; }
        th { color: #9ca3af; font-weight: 500; background: #111827; }
        
        /* ⚡ 表格每一行尾部的獨立「重新測速」按鈕 */
        .single-test-btn {
            background: #1e293b;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 95px; /* 鎖定最小寬度，防止文字擠壓 */
        }
        .single-test-btn:hover { background: #3b82f6; color: white; }
        .single-test-btn:disabled { background: #1f293d; color: #4b5563; border-color: transparent; cursor: not-allowed; }

        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .pending { background: #3b82f620; color: #60a5fa; }
        .success { background: #22c55e20; color: #4ade80; }
        .danger { background: #ef444420; color: #f87171; }
        .warning { background: #f59e0b20; color: #fbbf24; }

        @keyframes fast-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>OmniSpeed Pro</h1>
            <p>Fast 測速內核 + IP.sb 路由審計 · 全球 50 大站分組探針矩陣</p>
        </div>

        <div class="top-dashboards">
            <div class="card fast-dashboard">
                <div style="color: #60a5fa; font-weight: bold; font-size: 0.95rem;" id="current-target">真實下載速度 (Cloudflare 邊緣節點)</div>
                
                <div class="speed-box">
                    <div class="speed-display" id="speed-number">0.0</div>
                    <div class="unit-box">
                        <div class="unit">Mbps</div>
                    </div>
                    <button class="fast-reload-btn" id="main-reload-btn" onclick="triggerMainReload()" title="重新測速當前目標">🔄</button>
                </div>
                
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                <div id="test-status" style="margin-top: 12px; color: #9ca3af; font-size: 0.8rem;">正在選取節點...</div>
            </div>

            <div class="card" style="display: flex; flex-direction: column; justify-content: center;">
                <h3 style="margin: 0 0 15px 0; color: #60a5fa; font-size: 1.1rem; border-bottom: 1px solid #24324f; padding-bottom: 8px;">網絡身份與路由屬性</h3>
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b;"><span style="color:#9ca3af;">公網 IP 地址</span><span id="ip-value" style="font-weight:bold;">60.172.44.29</span></div>
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b;"><span style="color:#9ca3af;">核心運營商 (ISP)</span><span id="isp-value">Chinanet</span></div>
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b;"><span style="color:#9ca3af;">自主系統號 (ASN)</span><span id="asn-value">AS4134</span></div>
                <div style="display: flex; justify-content: space-between; padding: 10px 0;"><span style="color:#9ca3af;">地理位置區域</span><span id="location-value">China - Anhui</span></div>
            </div>
        </div>

        <div id="matrix-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
