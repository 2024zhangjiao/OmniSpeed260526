<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpeed Pro - 全球網絡審計集群</title>
    <style>
        :root { 
            --bg-color: #ffffff; 
            --card-bg: #ffffff; 
            --text-main: #222222; 
            --text-muted: #666666;
            --accent: #16a34a; /* 更深一點的綠色，適合白底閱讀 */
            --primary: #2563eb; /* 標準藍色 */
            --border-color: #e2e8f0; /* 輕量化灰色邊框 */
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
            -webkit-font-smoothing: antialiased;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        .header-area { text-align: center; margin-bottom: 40px; }
        .header-area h1 { margin: 0 0 10px 0; font-size: 2.4rem; font-weight: 700; color: #111111; }
        .header-area p { color: var(--text-muted); margin: 0; font-size: 1rem; }

        /* ⚖️ 頂部雙卡片 50% : 50% 絕對平均分配區域 */
        .top-dashboards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }
        @media (max-width: 900px) {
            .top-dashboards { grid-template-columns: 1fr; }
        }

        .card { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border-color); 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 380px; /* 鎖定兩側等高 */
        }

        /* 🎯 左側 Fast.com 純白質感核心測速區 */
        .fast-style-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .target-title {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        /* 主下載速度大字 */
        .main-speed-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            margin: 5px 0;
        }

        .huge-speed {
            font-size: 6.5rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
            letter-spacing: -2px;
        }

        .huge-unit-box {
            text-align: left;
            padding-bottom: 12px;
        }

        .huge-unit {
            font-size: 1.8rem;
            font-weight: 500;
            color: var(--text-main);
            display: block;
            line-height: 1.8rem;
        }

        /* 🔘 Start / 重新測速控制按鈕（仿 Fast 圓圈極簡風格） */
        .start-btn {
            background: transparent;
            border: 2px solid #444444;
            color: #444444;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            padding: 0;
        }
        .start-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.05);
        }
        .start-btn.running {
            animation: fast-spin 1s infinite linear;
            border-color: #cccccc;
            color: #cccccc;
            pointer-events: none;
        }

        /* 進度條 */
        .progress-container { width: 85%; background: #f1f5f9; height: 4px; border-radius: 2px; overflow: hidden; margin: 20px 0; }
        .progress-bar { width: 0%; height: 100%; background: var(--text-main); transition: width 0.1s ease; }

        /* 📊 Fast 下方多指標數據網格 */
        .fast-metrics-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
            margin-top: 10px;
            text-align: left;
        }

        .metric-col {
            padding: 0 20px;
        }
        .metric-col:first-child {
            border-right: 1px solid #eeeeee;
        }

        .metric-label {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .metric-sub-flex {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .sub-item-block {
            flex: 1;
        }

        .sub-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .sub-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .sub-unit {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-main);
            margin-left: 2px;
        }

        /* 右側路由屬性列表 */
        .route-list {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .route-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 1rem;
        }
        .route-item:last-child { border-bottom: none; }
        .route-label { color: var(--text-muted); }
        .route-val { font-weight: 600; color: var(--text-main); }

        /* 下方大站白底矩陣 */
        .category-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
        .category-title { font-size: 1.25rem; color: #e11d48; font-weight: 700; margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 2px solid #ffe4e6; }
        
        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        th { color: var(--text-muted); font-weight: 600; background: #f8fafc; }
        
        /* ⚡ 重新測速按鈕 */
        .single-test-btn {
            background: #ffffff; color: var(--primary); border: 1px solid rgba(37, 99, 235, 0.4);
            padding: 7px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; min-width: 95px; text-align: center;
        }
        .single-test-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .single-test-btn:disabled { background: #f1f5f9; color: #94a3b8; border-color: transparent; cursor: not-allowed; }

        /* 📊 白色底色專用高對比狀態標籤 */
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .pending { background: #eff6ff; color: #2563eb; }
        .success { background: #f0fdf4; color: #16a34a; }
        .danger { background: #fef2f2; color: #dc2626; }
        .warning { background: #fffbeb; color: #d97706; }

        @keyframes fast-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>OmniSpeed Pro</h1>
            <p>Fast 極簡內核架構 · 全球 50 大站集群獨立審計與狀態觀測</p>
        </div>

        <div class="top-dashboards">
            
            <div class="card">
                <div class="fast-style-container">
                    <div class="target-title" id="current-target">Your Internet speed is</div>
                    
                    <div class="main-speed-row">
                        <div class="huge-speed" id="download-value">0</div>
                        <div class="huge-unit-box">
                            <span class="huge-unit">Mbps</span>
                            <button class="start-btn" id="start-action-btn" onclick="triggerMainSpeedTest()" title="開始重新測速">↻</button>
                        </div>
                    </div>
                    
                    <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                    <div id="test-status-msg" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px;">點擊上方 ↻ 按鈕或下方站點開始獨立審計</div>

                    <div class="fast-metrics-grid">
                        <div class="metric-col">
                            <div class="metric-label">Latency (時延)</div>
                            <div class="metric-sub-flex">
                                <div class="sub-item-block">
                                    <span class="sub-label">Unloaded</span>
                                    <span class="sub-value" id="latency-unloaded">--</span><span class="sub-unit">ms</span>
                                </div>
                                <div class="sub-item-block">
                                    <span class="sub-label">Loaded</span>
                                    <span class="sub-value" id="latency-loaded">--</span><span class="sub-unit">ms</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="metric-col">
                            <div class="metric-label">Upload & Loss</div>
                            <div class="metric-sub-flex">
                                <div class="sub-item-block">
                                    <span class="sub-label">Speed</span>
                                    <span class="sub-value" id="upload-value">--</span><span class="sub-unit">Mbps</span>
                                </div>
                                <div class="sub-item-block">
                                    <span class="sub-label">Loss (丟包)</span>
                                    <span class="sub-value" id="loss-value">--</span><span class="sub-unit">%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="card">
                <div class="route-list">
                    <h3 style="margin: 0 0 20px 0; color: var(--primary); font-size: 1.2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">網絡身份與路由屬性</h3>
                    <div class="route-item"><span class="route-label">公網 IP 地址</span><span class="route-val" id="ip-value">60.172.44.29</span></div>
                    <div class="route-item"><span class="route-label">核心運營商 (ISP)</span><span class="route-val" id="isp-value">Chinanet</span></div>
                    <div class="route-item"><span class="route-label">自主系統號 (ASN)</span><span class="route-val" id="asn-value">AS4134</span></div>
                    <div class="route-item"><span class="route-label">地理位置區域</span><span class="route-val" id="location-value">China - Anhui</span></div>
                    <div class="route-item"><span class="route-label">基準連通時延</span><span class="route-val" id="base-latency-value" style="color: var(--accent);">24 ms</span></div>
                </div>
            </div>
        </div>

        <div id="matrix-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
