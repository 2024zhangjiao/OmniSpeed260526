<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpeed Pro - 全維度網路資產與風控審計看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .neon-glow { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .cyber-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <h1 class="text-xl font-bold text-blue-400 neon-glow flex items-center gap-2">
            🚀 OmniSpeed Pro <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded border border-blue-500/30">v2.0 專業審計版</span>
        </h1>
        <div class="text-xs text-slate-400" id="current-time">SYSTEM READY</div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 flex flex-col gap-6">
            <div class="cyber-panel border border-slate-800 rounded-2xl p-6 text-center shadow-xl">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">當前即時網速</h3>
                <div class="text-6xl font-black text-white my-4"><span id="speed-value">0.0</span><span class="text-xl text-blue-400 ml-2">Mbps</span></div>
                
                <div class="grid grid-cols-2 gap-2 my-4">
                    <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-800/60">
                        <div class="text-xs text-slate-400">延遲 (Ping)</div>
                        <div id="ping-value" class="text-lg font-bold text-emerald-400">-- ms</div>
                    </div>
                    <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-800/60">
                        <div class="text-xs text-slate-400">抖動 (Jitter)</div>
                        <div id="jitter-value" class="text-lg font-bold text-amber-400">-- ms</div>
                    </div>
                </div>

                <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-300 transform active:scale-95 shadow-lg shadow-blue-600/30 cursor-pointer">
                    開始全維度審計與測速
                </button>
            </div>

            <div class="cyber-panel border border-slate-800 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
                <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                    💡 智能專家生產場景建議
                </h3>
                <div id="advisor-content" class="text-xs text-slate-400 space-y-3 flex-1 overflow-y-auto">
                    <p class="italic text-slate-500">等待網路元數據審 identity 解算完成後，系統將自動生成合規與風控生產建議...</p>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 cyber-panel border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col">
            <h3 class="text-sm font-bold text-slate-200 mb-4 flex items-center justify-between">
                <span>🛡️ 全維度網路元數據資產看板 (100+ Indicators Audit)</span>
                <span id="audit-status" class="text-xs text-slate-500">未審計</span>
            </h3>
            
            <div class="flex-1 overflow-y-auto pr-2 space-y-4 max-h-[650px]" id="audit-container">
                <div class="text-center py-20 text-slate-500 text-xs">
                    請點擊左側按鈕啟動本地 WebRTC 穿透與邊緣元數據解算引擎
                </div>
            </div>
        </div>

    </main>

    <footer class="p-4 text-center text-xs text-slate-600 border-t border-slate-900">
        開源無廣告審計系統 · 全前端邊緣計算不儲存任何隱私 · Powered by Pure JS & WebRTC
    </footer>

    <script src="app.js"></script>
</body>
</html>
