<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniSpeed Pro - 全球顶级影响力站点网络审计</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #2f81f7;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --accent: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 32px 20px;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; }

/* ── 标题 ── */
.header { text-align: center; margin-bottom: 36px; }
.header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
.header p  { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }

/* ── 顶部双卡片 ── */
.top-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
@media(max-width:800px){ .top-grid{ grid-template-columns:1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px;
}

/* ── 左卡：主测速 ── */
.speed-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 360px;
}
.speed-label { color: var(--muted); font-size: 0.95rem; margin-bottom: 6px; }
.speed-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin: 4px 0 16px;
}
.speed-num {
  font-size: 6rem;
  font-weight: 800;
  line-height: 1;
  color: var(--text);
  letter-spacing: -2px;
}
.speed-unit { font-size: 1.6rem; font-weight: 500; padding-bottom: 10px; color: var(--muted); }

/* ── 主面板重测按钮 ── */
#main-start-btn {
  margin-top: 4px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 28px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
}
#main-start-btn:hover  { opacity: .85; }
#main-start-btn:active { transform: scale(.97); }
#main-start-btn:disabled {
  background: #2a3a50;
  color: var(--muted);
  cursor: not-allowed;
}

.progress-wrap {
  width: 80%;
  background: var(--border);
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  margin: 18px 0 10px;
}
.progress-bar { width: 0%; height: 100%; background: var(--blue); transition: width .1s; }
.status-msg { color: var(--muted); font-size: 0.82rem; min-height: 18px; }

.metrics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  width: 100%;
  border-top: 1px solid var(--border);
  margin-top: 20px;
  padding-top: 20px;
}
.metric-col { padding: 0 16px; }
.metric-col:first-child { border-right: 1px solid var(--border); }
.metric-title { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.metric-pair { display: flex; gap: 20px; }
.metric-item .sub-label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 2px; }
.metric-item .sub-val   { font-size: 1.5rem; font-weight: 700; color: var(--text); }
.metric-item .sub-unit  { font-size: 0.8rem; color: var(--muted); margin-left: 2px; }

/* ── 右卡：路由信息 ── */
.route-card { display: flex; flex-direction: column; justify-content: center; }
.route-card h3 { font-size: 1rem; color: var(--accent); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.route-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #21262d;
  font-size: 0.95rem;
}
.route-row:last-child { border: none; }
.route-key { color: var(--muted); }
.route-val { font-weight: 600; color: var(--text); }

/* ── 站点矩阵 ── */
.cat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 24px;
}
.cat-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #f85149;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid #2d1a1a;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 13px 12px;
  text-align: left;
  border-bottom: 1px solid #21262d;
  font-size: 0.9rem;
}
th { color: var(--muted); font-weight: 600; background: #0d1117; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .4px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(48,54,61,.4); }

/* ── 行按钮 ── */
.row-btn {
  padding: 6px 16px;
  background: transparent;
  color: var(--blue);
  border: 1px solid rgba(47,129,247,.4);
  border-radius: 6px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all .18s;
  min-width: 90px;
}
.row-btn:hover    { background: var(--blue); color: #fff; border-color: var(--blue); }
.row-btn:disabled { background: #1c2128; color: var(--muted); border-color: transparent; cursor: not-allowed; }

/* ── 状态标签 ── */
.badge { padding: 3px 9px; border-radius: 5px; font-size: 0.78rem; font-weight: 700; display: inline-block; white-space: nowrap; }
.badge-pending  { background: #1c2a3a; color: var(--blue); }
.badge-success  { background: #122d1f; color: var(--green); }
.badge-warning  { background: #2d2208; color: var(--yellow); }
.badge-danger   { background: #2d1212; color: var(--red); }

@keyframes spin { to { transform: rotate(360deg); } }
.spinning { display: inline-block; animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🚀 OmniSpeed Pro</h1>
    <p>全球顶级影响力站点网络审计 · 50 大站独立测速矩阵</p>
  </div>

  <div class="top-grid">

    <!-- 左：主测速面板 -->
    <div class="card speed-card">
      <div class="speed-label" id="speed-label">真实下载速度（Cloudflare 边缘节点）</div>
      <div class="speed-row">
        <div class="speed-num" id="dl-val">--</div>
        <div class="speed-unit">Mbps</div>
      </div>

      <!-- ★ 主面板 Start 按钮 ★ -->
      <button id="main-start-btn" onclick="onMainStart()">▶ 开始测速</button>

      <div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
      <div class="status-msg" id="status-msg">点击上方按钮开始测速</div>

      <div class="metrics-grid">
        <div class="metric-col">
          <div class="metric-title">Latency 时延</div>
          <div class="metric-pair">
            <div class="metric-item">
              <span class="sub-label">Unloaded</span>
              <span class="sub-val" id="lat-un">--</span><span class="sub-unit">ms</span>
            </div>
            <div class="metric-item">
              <span class="sub-label">Loaded</span>
              <span class="sub-val" id="lat-ld">--</span><span class="sub-unit">ms</span>
            </div>
          </div>
        </div>
        <div class="metric-col">
          <div class="metric-title">Upload & Loss</div>
          <div class="metric-pair">
            <div class="metric-item">
              <span class="sub-label">Upload</span>
              <span class="sub-val" id="ul-val">--</span><span class="sub-unit">Mbps</span>
            </div>
            <div class="metric-item">
              <span class="sub-label">丢包</span>
              <span class="sub-val" id="loss-val">--</span><span class="sub-unit">%</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右：路由信息 -->
    <div class="card route-card">
      <h3>🌐 网络身份与路由属性</h3>
      <div class="route-row"><span class="route-key">公网 IP 地址</span>   <span class="route-val" id="r-ip">检测中…</span></div>
      <div class="route-row"><span class="route-key">核心运营商 (ISP)</span><span class="route-val" id="r-isp">检测中…</span></div>
      <div class="route-row"><span class="route-key">自主系统号 (ASN)</span><span class="route-val" id="r-asn">检测中…</span></div>
      <div class="route-row"><span class="route-key">地理位置区域</span>   <span class="route-val" id="r-loc">检测中…</span></div>
      <div class="route-row"><span class="route-key">基准连通时延</span>   <span class="route-val" id="r-lat" style="color:var(--green)">检测中…</span></div>
    </div>

  </div>

  <!-- 50 大站矩阵（由 app.js 渲染） -->
  <div id="matrix"></div>

</div>
<script src="app.js"></script>
</body>
</html>
