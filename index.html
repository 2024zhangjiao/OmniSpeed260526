<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpeed Pro - 50大站獨立審計系統</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: #151d30; 
            --text-main: #f3f4f6; 
            --accent: #22c55e; 
            --primary: #3b82f6;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
        }
        
        .header-area { text-align: center; margin-bottom: 20px; }
        .header-area h1 { margin: 0 0 5px 0; font-size: 2.2rem; letter-spacing: 1px; }
        .header-area p { color: #9ca3af; margin: 0; font-size: 0.95rem; }

        /* 主體佈局 */
        .main-layout { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 20px; 
            max-width: 1600px; 
            margin: 0 auto; 
            align-items: start;
        }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
            .side-panel { position: static !important; }
        }

        .matrix-area { width: 100%; }

        /* 右側懸浮面板 */
        .side-panel { 
            position: sticky; 
            top: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            border: 1px solid #24324f; 
        }

        /* 🚀 Fast 風格儀表盤 */
        .fast-dashboard { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            position: relative;
            min-height: 300px;
        }
        .target-indicator {
            font-size: 0.9rem;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        /* 數字與重新測速按鈕的組合區域 */
        .fast-speed-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .speed-display { 
            font-size: 4.2rem; 
            font-weight: 800; 
            color: var(--text-main); 
            line-height: 1; 
            font-variant-numeric: tabular-nums; 
        }
        .unit-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }
        .unit { font-size: 1.2rem; color: #9ca3af; font-weight: 400; }
        
        /* 🔄 右側主面板的仿 Fast 重新測速按鈕 */
        .fast-reload-btn {
            background: transparent;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
            margin-top: 5px;
        }
        .fast-reload-btn:hover {
            background: #3b82f6;
            color: white;
            transform: rotate(180deg);
        }
        .fast-reload-btn.spinning {
            animation: fast-spin 1s infinite linear;
            border-color: #4b5563;
            color: #4b5563;
            pointer-events: none;
        }

        .progress-container { width: 100%; background: #24324f; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s ease; }
        
        /* 大廠分類板塊 */
        .category-card { background: #111827; border: 1px solid #1f293d; border-radius: 14px; padding: 18px; margin-bottom: 20px; }
        .category-title { font-size: 1.15rem; color: #f43f5e; font-weight: bold; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid #311d27; }
        
        /* 表格結構加固 */
        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #1f293d; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #9ca3af; font-weight: 500; background: #151d30; }
        
        /* ⚡ 表格每一行的「重新測速」按鈕 - 強制顯現 */
        .single-test-btn {
            background: #1e293b;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 90px; /* 強制寬度，防止被擠壓看不見 */
            box-sizing: border-box;
        }
        .single-test-btn:hover { background: #3b82f6; color: white; }
        .single-test-btn:disabled { background: #1f293d; color: #4b5563; border-color: transparent; cursor: not-allowed; }

        /* 標籤狀態 */
        .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .pending { background: #3b82f620; color: #60a5fa; }
        .success { background: #22c55e20; color: #4ade80; }
        .danger { background: #ef444420; color: #f87171; }
        .warning { background: #f59e0b20; color: #fbbf24; }

        @keyframes fast-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>OmniSpeed Pro</h1>
        <p>全球 50 大站獨立節點審計集群 · 支援單站手動 Fast 內核模擬測速</p>
    </div>

    <div class="main-layout">
        
        <div class="matrix-area" id="matrix-container">
            </div>

        <div class="side-panel">
            
            <div class="card fast-dashboard">
                <div class="target-indicator" id="current-target">當前觀測節點: 預設基準 (Cloudflare)</div>
                
                <div class="fast-speed-area">
                    <div class="speed-display" id="speed-number">0.0</div>
                    <div class="unit-area">
                        <div class="unit">Mbps</div>
                        <button class="fast-reload-btn" id="main-reload-btn" onclick="triggerMainReload()" title="重新測速當前節點">🔄</button>
                    </div>
                </div>
                
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                <div id="test-status" style="margin-top: 15px; color: #9ca3af; font-size: 0.8rem;">請在左側點擊任意站點右側的 ⚡重新測速 按鈕</div>
            </div>

            <div class="card" style="padding: 20px;">
                <h3 style="margin: 0 0 12px 0; color: #60a5fa; font-size: 1.1rem; border-bottom: 1px solid #24324f; padding-bottom: 8px;">網路身份與路由屬性</h3>
                <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 0.85rem;"><span style="color:#9ca3af;">公網 IP 地址</span><span id="ip-value">自動解析中...</span></div>
                <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 0.85rem;"><span style="color:#9ca3af;">運營商 (ISP)</span><span id="isp-value">自動解析中...</span></div>
                <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 0.85rem;"><span style="color:#9ca3af;">地理位置區域</span><span id="location-value">自動解析中...</span></div>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
