<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpeed - 聚合網路診斷工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .neon-glow { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400 neon-glow">🚀 OmniSpeed</h1>
        <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded">v1.0 開源全功能版</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-xl">
            <h3 class="text-sm text-slate-400 uppercase tracking-wider mb-2">當前即時網速</h3>
            <div class="text-5xl font-black text-white my-4"><span id="speed-value">0.0</span> <span class="text-xl text-blue-400">Mbps</span></div>
            <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-2xl transition duration-300 transform active:scale-95 shadow-lg shadow-blue-600/30">
                開始一鍵測速
            </button>
        </div>

        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
            <h3 class="text-sm font-semibold text-slate-300 border-b border-slate-800 pb-2">🌐 核心網路指標診斷</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/50">
                    <div class="text-xs text-slate-500">網路延遲 (Ping)</div>
                    <div id="ping-value" class="text-lg font-bold text-emerald-400">--</div>
                </div>
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/50">
                    <div class="text-xs text-slate-500">抖動 (Jitter)</div>
                    <div id="jitter-value" class="text-lg font-bold text-amber-400">--</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-slate-600 border-t border-slate-900">
        開源免費專案 • 沒有任何追蹤器與廣告
    </footer>

    <script src="app.js"></script>
</body>
</html>
